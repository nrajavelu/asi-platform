<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AICodeStudio</title>
<style>
  :root { --blue-600: #1450e8; --cyan-400: #3dd1f2; --ink-900: #17181b; --ink-500: #6c7077; --paper-50: #f6f9fc; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", sans-serif; background: var(--paper-50); }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; }
  .name {
    font-weight: 800; font-size: 22px;
    background: linear-gradient(120deg, var(--cyan-400), var(--blue-600));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { color: var(--ink-500); font-size: 14px; max-width: 360px; }
</style>
</head>
<body>
  <div class="name">AICodeStudio</div>
  <h1>This session has already been submitted</h1>
  <p>Your answers were recorded. You can close this window.</p>
</body>
</html>
