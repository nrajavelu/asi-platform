{% extends "base.html" %}
{% block content %}
<h1>Upload Candidates</h1>
<p class="subtitle">Adds candidates to a round's roster. Duplicate emails are skipped automatically.</p>

<div class="card">
  <form action="/candidates/upload" method="post" enctype="multipart/form-data">
    <label>Round</label>
    <select name="round_id" required>
      {% for r in rounds %}
      <option value="{{ r.id }}">#{{ r.id }} - {{ r.drive.name }} ({{ r.round_type }})</option>
      {% endfor %}
    </select>

    <label>Candidates file (.csv or .xlsx, columns: name, email)</label>
    <input type="file" name="file" accept=".csv,.xlsx" required>

    <button type="submit">Upload</button>
  </form>
</div>
{% endblock %}
