  /* Tokens derived from aizentify.com's own brand palette (navy/ink base,
     blue/cyan accent, green/red status pair) and typefaces (Sora/Inter).
     Variable names below (--brass/--teal/--rust) are kept from the prior
     palette to avoid touching every usage site -- only the values changed:
     --brass now carries the brand blue, --teal the brand green (positive/
     status-good), --rust the brand red (negative/status-critical). */
  :root{
    --bg:#F6F9FC; --surface:#FFFFFF; --surface-2:#EEF3F9; --raised:#FFFFFF;
    --ink:#17181B; --muted:#3D4045; --faint:#6C7077;
    --line:#DFE6F0; --line-strong:rgba(23,24,27,0.22);
    --brass:#1A7EE8; --brass-soft:rgba(26,126,232,0.12);
    --teal:#157A56; --teal-soft:rgba(27,156,110,0.12);
    --rust:#B3202F; --rust-soft:rgba(217,45,60,0.12);
    --paper:#EEF3F9; --paper-ink:#17181B;
    --shadow:0 1px 2px rgba(10,11,13,0.05), 0 10px 26px -16px rgba(10,11,13,0.22);
    --radius-s:6px; --radius-m:10px; --radius-l:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0B0D; --surface:#1A1C20; --surface-2:#2B2E33; --raised:#242629;
      --ink:#F1F4F8; --muted:#9EA3A9; --faint:#6C7077;
      --line:rgba(241,244,248,0.14); --line-strong:rgba(241,244,248,0.28);
      --brass:#1EA7E8; --brass-soft:rgba(30,167,232,0.16);
      --teal:#22B67F; --teal-soft:rgba(34,182,127,0.16);
      --rust:#E8535F; --rust-soft:rgba(232,83,95,0.16);
      --paper:#2B2E33; --paper-ink:#F1F4F8;
      --shadow:0 1px 2px rgba(0,0,0,0.4), 0 14px 32px -18px rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0B0D; --surface:#1A1C20; --surface-2:#2B2E33; --raised:#242629;
    --ink:#F1F4F8; --muted:#9EA3A9; --faint:#6C7077;
    --line:rgba(241,244,248,0.14); --line-strong:rgba(241,244,248,0.28);
    --brass:#1EA7E8; --brass-soft:rgba(30,167,232,0.16);
    --teal:#22B67F; --teal-soft:rgba(34,182,127,0.16);
    --rust:#E8535F; --rust-soft:rgba(232,83,95,0.16);
    --paper:#2B2E33; --paper-ink:#F1F4F8;
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 14px 32px -18px rgba(0,0,0,0.7);
  }

  *{ box-sizing:border-box; }
  html{ font-size:19px; } /* the whole type scale below is in rem, so this one line resizes all of it */
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  a{ color:inherit; } ul{ margin:0; padding:0; list-style:none; } p{ margin:0; }
  h1,h2,h3,h4{ font-family:'Sora',ui-sans-serif,system-ui,sans-serif; font-weight:700; margin:0; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,"SF Mono",Menlo,monospace; }
  .tabular{ font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; color:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .wrap{ max-width:1280px; margin:0 auto; padding:0 28px; }

  .eyebrow{ font-weight:700; font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }

  /* ---- topbar ---- */
  .topbar{ position:sticky; top:0; z-index:60; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:20px; height:64px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Sora',serif; font-weight:700; font-size:1.05rem; }
  .brand-mark{ height:24px; width:auto; display:block; flex:none; }
  .poc-tag{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; padding:3px 8px; border-radius:100px; border:1px solid var(--line-strong); color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
  .role-tabs{ display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:100px; }
  .role-tab{ border:none; background:transparent; padding:8px 16px; border-radius:100px; font-size:0.82rem; font-weight:600; color:var(--muted); }
  .role-tab.active{ background:var(--raised); color:var(--ink); box-shadow:var(--shadow); }

  /* ---- case rail ---- */
  .case-rail-wrap{ padding:22px 0 0; }
  .case-rail{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  @media (max-width:1180px){ .case-rail{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:760px){ .case-rail{ grid-template-columns:1fr 1fr; } }
  @media (max-width:460px){ .case-rail{ grid-template-columns:1fr; } }
  .case-card{ text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-m); padding:16px 17px; display:flex; flex-direction:column; gap:6px; transition:border-color .15s, transform .1s; }
  .case-card:hover{ border-color:var(--line-strong); }
  .case-card.active{ border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); }
  .case-tag{ font-size:0.72rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal); }
  .case-card h3{ font-size:0.98rem; color:var(--ink); }
  .case-card .syn{ font-size:0.78rem; color:var(--muted); line-height:1.45; }

  main{ padding:26px 0 80px; min-height:60vh; }
  .view-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .status-strip{ display:flex; align-items:center; gap:16px; font-size:0.78rem; color:var(--muted); flex-wrap:wrap; }
  .status-strip .dot{ width:6px; height:6px; border-radius:50%; background:var(--teal); display:inline-block; margin-right:6px; }
  @media (prefers-reduced-motion:no-preference){ .pulse{ animation:pulse 2.2s ease-in-out infinite; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); }
  .btn{ font-weight:700; font-size:0.8rem; padding:9px 16px; border-radius:100px; border:1px solid var(--line-strong); background:var(--raised); color:var(--ink); display:inline-flex; align-items:center; gap:7px; }
  .btn:hover{ border-color:var(--brass); }
  .btn-icon{ font-size:0.9em; }

  /* ---- student workspace ---- */
  .workspace{ display:grid; grid-template-columns:250px 1fr 300px; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; }
  @media (max-width:1040px){ .workspace{ grid-template-columns:1fr; } }
  .ws-col{ background:var(--surface); padding:20px; }
  .ws-label{ font-size:0.68rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:0.72rem; padding:5px 10px; border-radius:100px; border:1px solid var(--line-strong); margin:0 6px 6px 0; }
  .chip .dot{ width:6px; height:6px; border-radius:50%; }
  .doc-card{ background:var(--paper); color:var(--paper-ink); border-radius:8px; padding:15px; font-size:0.82rem; line-height:1.65; margin-top:12px; }
  .doc-card mark{ background:none; padding:0 1px; border-bottom:2px solid; font-weight:600; }
  .cite-tag{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--faint); }
  .source-list{ display:flex; flex-direction:column; gap:5px; margin-top:10px; font-size:0.74rem; color:var(--muted); }
  .source-list li::before{ content:"— "; color:var(--faint); }

  .pestle-strip{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .pestle-chip{ font-size:0.7rem; padding:6px 11px; border-radius:100px; border:1px solid var(--line-strong); color:var(--muted); }
  .pestle-chip.active{ font-weight:700; }
  .pestle-chip .horizon{ opacity:0.72; font-weight:500; }
  .classify-rule{ font-size:0.71rem; color:var(--faint); padding:7px 10px; background:var(--surface-2); border-radius:7px; margin-bottom:14px; line-height:1.5; }
  .classify-rule b{ color:var(--muted); font-weight:700; }
  .priority-row{ display:flex; gap:6px; margin-top:6px; }
  .priority-tag{ font-size:0.68rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:2px 7px; border-radius:100px; background:var(--surface-2); color:var(--faint); }
  .swot{ display:grid; grid-template-columns:16px 1fr 1fr; grid-template-rows:auto 1fr 1fr; gap:9px; }
  .swot-row-label{ writing-mode:vertical-rl; transform:rotate(180deg); font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); display:flex; align-items:center; justify-content:center; }
  .swot-head{ font-size:0.72rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); padding-bottom:1px; }
  .swot-cell{ border-radius:8px; padding:12px 13px; font-size:0.8rem; line-height:1.5; border:1px solid var(--line); }
  .swot-pos{ background:var(--teal-soft); }
  .swot-neg{ background:var(--rust-soft); }
  .swot-title{ font-weight:700; font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:5px; }
  .swot-cell .cite-tag{ display:block; margin-top:5px; }

  .chat-thread{ display:flex; flex-direction:column; gap:11px; margin-bottom:14px; min-height:120px; }
  .bubble{ padding:10px 12px; border-radius:10px; font-size:0.81rem; line-height:1.5; max-width:96%; opacity:0; animation:rise .35s ease forwards; }
  @media (prefers-reduced-motion:reduce){ .bubble{ animation:none; opacity:1; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .bubble-ai{ background:var(--surface-2); border:1px solid var(--line); border-top-left-radius:2px; }
  .bubble-user{ background:var(--brass-soft); border:1px solid color-mix(in srgb, var(--brass) 40%, transparent); align-self:flex-end; border-top-right-radius:2px; }
  .bubble-label{ font-size:0.7rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
  .caret{ display:inline-block; width:2px; height:1em; background:var(--teal); margin-left:1px; vertical-align:text-bottom; }
  @media (prefers-reduced-motion:no-preference){ .caret{ animation:blink 0.9s step-end infinite; } }
  @keyframes blink{ 50%{ opacity:0; } }
  .input-bar{ display:flex; align-items:center; gap:10px; border:1px solid var(--line-strong); border-radius:100px; padding:10px 15px; font-size:0.8rem; color:var(--faint); }

  .score-ring{ display:flex; align-items:center; gap:13px; padding:13px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
  .score-value{ font-family:'Sora',serif; font-size:1.5rem; font-weight:600; }
  .score-sub{ font-size:0.7rem; color:var(--muted); }

  /* ---- faculty console ---- */
  .stat-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; margin-bottom:20px; }
  @media (max-width:900px){ .stat-tiles{ grid-template-columns:1fr 1fr; } }
  .stat-tile{ background:var(--surface); padding:18px 20px; }
  .stat-tile .v{ font-family:'Sora',serif; font-size:1.55rem; font-weight:600; display:flex; align-items:baseline; gap:6px; }
  .stat-tile .delta{ font-size:0.7rem; font-weight:700; }
  .stat-tile .l{ font-size:0.75rem; color:var(--muted); margin-top:3px; }
  .up{ color:var(--teal); } .down{ color:var(--rust); }

  .faculty-grid{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:20px; margin-bottom:20px; }
  @media (max-width:980px){ .faculty-grid{ grid-template-columns:1fr; } }
  .faculty-grid .card{ padding:20px; }

  .meter-row{ display:flex; align-items:center; gap:12px; padding:8px 0; }
  .meter-label{ width:130px; font-size:0.79rem; color:var(--muted); flex:none; }
  .meter-track{ flex:1; height:6px; border-radius:100px; background:var(--surface-2); overflow:hidden; }
  .meter-fill{ height:100%; border-radius:100px; background:var(--brass); width:0; transition:width 1s cubic-bezier(.2,.8,.2,1); }
  .meter-val{ width:32px; text-align:right; font-size:0.76rem; flex:none; }

  .feed{ display:flex; flex-direction:column-reverse; gap:8px; min-height:170px; max-height:210px; overflow:hidden; }
  .feed-item{ font-size:0.79rem; padding:9px 11px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line); opacity:0; animation:rise .3s ease forwards; }
  @media (prefers-reduced-motion:reduce){ .feed-item{ animation:none; opacity:1; } }
  .feed-item .t{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--faint); margin-right:8px; }

  .flag-table{ width:100%; border-collapse:collapse; font-size:0.79rem; }
  .flag-table th{ text-align:left; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:0 0 8px; border-bottom:1px solid var(--line-strong); }
  .flag-table td{ padding:10px 10px 10px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
  .flag-pill{ font-size:0.7rem; padding:4px 10px; border-radius:100px; background:var(--rust-soft); color:var(--rust); font-weight:600; white-space:nowrap; }

  .integrity-card{ display:flex; align-items:flex-start; gap:12px; padding:16px 18px; margin-bottom:20px; }

  /* ---- case studio ---- */
  .studio-cols{ display:grid; grid-template-columns:260px 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; }
  @media (max-width:900px){ .studio-cols{ grid-template-columns:1fr; } }
  .studio-side{ background:var(--surface); padding:20px; }
  .studio-main{ background:var(--surface); padding:20px; }
  .prompt-card{ border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .prompt-card.is-active{ border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); }
  .prompt-status{ font-size:0.63rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:3px 8px; border-radius:100px; display:inline-block; margin-bottom:7px; }
  .prompt-status.ready{ background:var(--teal-soft); color:var(--teal); }
  .prompt-status.queued{ background:var(--surface-2); color:var(--faint); }
  .prompt-card p{ font-size:0.82rem; line-height:1.42; }
  .prompt-new{ border:1px dashed var(--line-strong); border-radius:10px; padding:12px 14px; font-size:0.8rem; color:var(--faint); text-align:center; }
  .annotation{ display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .annotation:first-child{ border-top:none; }
  .annotation-tag{ font-size:0.62rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--brass); flex:none; width:64px; padding-top:2px; }
  .annotation p{ font-size:0.82rem; color:var(--muted); line-height:1.5; }
  .approve-row{ display:flex; align-items:center; gap:12px; margin-top:18px; padding-top:18px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .btn.is-done{ border-color:var(--teal); color:var(--teal); }
  .integrity-dot{ width:10px; height:10px; border-radius:50%; margin-top:5px; flex:none; }
  .integrity-card h4{ font-family:'Inter'; font-weight:700; font-size:0.88rem; margin-bottom:4px; }
  .integrity-card p{ font-size:0.83rem; color:var(--muted); }

  /* ---- economics tab ---- */
  .zero-cost-ribbon{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:10px; background:var(--teal-soft); border:1px solid color-mix(in srgb, var(--teal) 35%, transparent); font-size:0.85rem; margin-bottom:22px; }
  .zero-cost-ribbon b{ color:var(--teal); }
  .econ-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  @media (max-width:980px){ .econ-grid{ grid-template-columns:1fr; } }
  .econ-grid .card{ padding:22px; }
  table.route-table{ width:100%; border-collapse:collapse; font-size:0.82rem; }
  table.route-table th{ text-align:left; font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:0 10px 10px 0; border-bottom:1px solid var(--line-strong); }
  table.route-table td{ padding:11px 10px 11px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.route-table tr:last-child td{ border-bottom:none; }
  .model-pill{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; padding:3px 9px; border-radius:100px; white-space:nowrap; display:inline-block; }
  .model-pill.haiku{ background:var(--teal-soft); color:var(--teal); }
  .model-pill.sonnet{ background:var(--brass-soft); color:var(--brass); }
  .model-pill.opus{ background:var(--rust-soft); color:var(--rust); }
  .model-pill.draft{ background:color-mix(in srgb, var(--ink) 10%, transparent); color:var(--muted); }
  .token-tactic{ display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .token-tactic:first-child{ border-top:none; }
  .token-tactic .tt-fig{ font-family:'Sora',serif; font-weight:600; font-size:1.05rem; color:var(--teal); width:58px; flex:none; }
  .token-tactic .tt-body h5{ font-family:'Inter'; font-weight:700; font-size:0.83rem; margin-bottom:2px; }
  .token-tactic .tt-body p{ font-size:0.79rem; color:var(--muted); }
  table.cost-table{ width:100%; border-collapse:collapse; font-size:0.83rem; }
  table.cost-table th{ text-align:left; font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:0 10px 10px 0; border-bottom:1px solid var(--line-strong); }
  table.cost-table td{ padding:10px 10px 10px 0; border-bottom:1px solid var(--line); }
  table.cost-table tr:last-child td{ border-bottom:none; font-weight:700; }
  table.cost-table td.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  .cost-hero{ display:flex; align-items:baseline; gap:12px; padding:20px 22px; background:var(--surface-2); border-radius:12px; margin-bottom:18px; }
  .cost-hero .fig{ font-family:'Sora',serif; font-weight:600; font-size:2.1rem; color:var(--teal); }
  .cost-hero .lbl{ font-size:0.84rem; color:var(--muted); }
  .econ-note{ font-size:0.76rem; color:var(--faint); line-height:1.6; margin-top:14px; }

  /* ---- pipeline ---- */
  .pipeline-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
  @media (max-width:980px){ .pipeline-grid{ grid-template-columns:1fr; } }
  .pipeline-grid .card{ padding:24px; }
  .stage-row{ display:flex; align-items:flex-start; margin-bottom:26px; }
  .stage{ display:flex; flex-direction:column; align-items:center; flex:1; position:relative; text-align:center; gap:8px; }
  .stage-dot{ width:30px; height:30px; border-radius:50%; border:2px solid var(--line-strong); background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--faint); transition:all .3s; z-index:1; }
  .stage.active .stage-dot{ border-color:var(--teal); color:var(--teal); }
  .stage.done .stage-dot{ border-color:var(--teal); background:var(--teal); color:var(--raised); }
  .stage-name{ font-size:0.72rem; font-weight:600; color:var(--muted); }
  .stage.done .stage-name, .stage.active .stage-name{ color:var(--ink); }
  .stage:not(:last-child)::after{ content:""; position:absolute; top:15px; left:50%; width:100%; height:2px; background:var(--line-strong); z-index:0; }
  .stage.done:not(:last-child)::after{ background:var(--teal); }
  .chunk-record{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:16px; font-family:'IBM Plex Mono',monospace; font-size:0.76rem; line-height:1.7; }
  .chunk-record .cr-key{ color:var(--teal); }
  .chunk-record .cr-str{ color:var(--brass); }
  .pipeline-stats{ display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; margin-bottom:18px; }
  .pstat{ display:flex; justify-content:space-between; background:var(--surface); padding:12px 16px; font-size:0.83rem; }
  .pstat .k{ color:var(--muted); }
  .pstat .v{ font-family:'IBM Plex Mono',monospace; font-weight:500; }

  footer{ padding:30px 0 50px; border-top:1px solid var(--line); }
  .footer-inner{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:0.76rem; color:var(--faint); }
</style>
</head>

  function playThread(thread, containerEl, onDone){
    containerEl.innerHTML = '';
    var i = 0;
    function next(){
      if (i >= thread.length){ if (onDone) onDone(); return; }
      var turn = thread[i]; i++;
      var b = document.createElement('div');
      b.className = 'bubble ' + (turn.role==='student' ? 'bubble-user' : turn.role==='faculty' ? 'bubble-user' : 'bubble-ai');
      var label = turn.role==='ai' ? 'Aizentify ASI' : turn.role==='student' ? 'Student' : 'Faculty';
      var labelEl = document.createElement('div'); labelEl.className='bubble-label'; labelEl.textContent = label;
      var textEl = document.createElement('div');
      b.appendChild(labelEl); b.appendChild(textEl);
      containerEl.appendChild(b);
      if (reduceMotion){ textEl.textContent = turn.text; timers.push(setTimeout(next, 120)); return; }
      var chars = turn.text.split(''); var ci = 0;
      var caret = document.createElement('span'); caret.className='caret'; textEl.appendChild(document.createTextNode('')); textEl.appendChild(caret);
      var iv = setInterval(function(){
        ci++;
        textEl.childNodes[0].nodeValue = chars.slice(0,ci).join('');
        containerEl.scrollTop = containerEl.scrollHeight;
        if (ci >= chars.length){ clearInterval(iv); caret.remove(); timers.push(setTimeout(next, 420)); }
      }, 14);
      timers.push(iv);
    }
    next();
  }

    var perSemester = perCase*6;
    return '<div class="zero-cost-ribbon"><span style="font-size:1.1rem;">●</span><span><b>This console: $0.00 spent.</b> Student, Faculty, and Pipeline are pre-scripted client-side — nothing on this page calls a live reasoning engine. The figures below are the Gateway\'s modeled cost, the same model the real platform uses to forecast spend before a rollout.</span></div>'+
    '<div class="card" style="padding:24px; margin-bottom:20px;">'+
      '<div class="ws-label">Aizentify AI Gateway</div>'+
      '<p style="font-size:0.92rem; color:var(--muted); max-width:70ch; line-height:1.65;">Every request from every role — extraction, Socratic dialogue, faculty query — passes through one internal gateway before it reaches a reasoning engine and before its response reaches a person. The product never hard-codes a specific model: the Gateway routes each request to the reasoning tier suited to its complexity and stakes, applies the citation guardrail uniformly on the way out, and can swap the engine serving a tier without changing anything a student or faculty member sees.</p>'+
    '</div>'+
    '<div class="econ-grid">'+
      '<div class="card"><div class="ws-label">Routing tiers</div>'+
        '<table class="route-table"><tr><th>Tier</th><th>Handles</th><th>Optimized for</th></tr>'+
          '<tr><td><span class="model-pill haiku">Scan</span></td><td>Factor extraction, PESTLE tagging, citation matching</td><td>Volume — cheapest tier, runs on every document</td></tr>'+
          '<tr><td><span class="model-pill sonnet">Synthesize</span></td><td>PESTLE↔SWOT correlation, the Socratic dialogue loop</td><td>Reasoning depth per dollar — the workhorse tier</td></tr>'+
          '<tr><td><span class="model-pill opus">Adjudicate</span></td><td>Faculty queries, grade appeals, cohort-integrity checks</td><td>Correctness over cost — lowest volume, highest stakes</td></tr>'+
          '<tr><td><span class="model-pill draft">Draft</span></td><td>Generating a new case from a faculty prompt, with web research</td><td>Depth over speed — rarest call, always reviewed before publish</td></tr>'+
        '</table>'+
        '<div class="econ-note">Technical note: today\'s tiers are served by Claude\'s model family (Anthropic) — Scan on its fastest tier, Synthesize on its balanced reasoning tier, Adjudicate on its highest-capability tier. Exact model versions are a Gateway configuration, not a product dependency, and can change without touching the platform experience above it.</div>'+
      '</div>'+
      '<div class="card"><div class="ws-label">Token management the Gateway handles</div>'+
        '<div class="token-tactic"><div class="tt-fig">~90%</div><div class="tt-body"><h5>Prompt caching</h5><p>A case\'s source documents are cached once and reused across every student\'s turns — a cache read costs roughly a tenth of a fresh read.</p></div></div>'+
        '<div class="token-tactic"><div class="tt-fig">top-k</div><div class="tt-body"><h5>Retrieval-scoped context</h5><p>Only the chunks relevant to a student\'s live hypothesis are sent — never the full source library on every turn.</p></div></div>'+
        '<div class="token-tactic"><div class="tt-fig">capped</div><div class="tt-body"><h5>Output ceilings</h5><p>Every tier has a hard per-call token cap, so one runaway response can\'t blow through a session\'s budget.</p></div></div>'+
        '<div class="token-tactic"><div class="tt-fig">−50%</div><div class="tt-body"><h5>Batch processing</h5><p>Non-real-time work — end-of-week grading passes, cohort analytics — runs through the batch queue at half the live rate.</p></div></div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="padding:24px;">'+
      '<div class="ws-label">Modeled cost — this case, this cohort</div>'+
      '<div class="cost-hero"><span class="fig">$'+perCase.toFixed(2)+'</span><span class="lbl">to run "'+c.name+'" for all '+c.students+' students, Scan + Synthesize + Adjudicate combined</span></div>'+
      '<table class="cost-table">'+
        '<tr><th>Line item</th><th></th><th style="text-align:right;">Cost</th></tr>'+
        '<tr><td>Scan — extraction & tagging, '+c.students+' students</td><td></td><td class="num">$'+(c.students*SCAN_PER_STUDENT).toFixed(2)+'</td></tr>'+
        '<tr><td>Synthesize — Socratic dialogue, '+c.students+' students × ~5 turns, cached context</td><td></td><td class="num">$'+(c.students*SYNTH_PER_STUDENT).toFixed(2)+'</td></tr>'+
        '<tr><td>Adjudicate — faculty queries & integrity checks</td><td></td><td class="num">$'+ADJUDICATE_PER_CASE.toFixed(2)+'</td></tr>'+
        '<tr><td>Total, this case</td><td></td><td class="num">$'+perCase.toFixed(2)+'</td></tr>'+
        '<tr><td>Projected, full semester (6 cases, same cohort)</td><td></td><td class="num">$'+perSemester.toFixed(2)+'</td></tr>'+
      '</table>'+
      '<div class="econ-note">Modeled, not measured — built from published per-token rates and the caching/routing assumptions above. For real, measured numbers on a live call (actual tokens, actual latency, actual dollars), run <code class="mono">poc-backend/benchmark.py</code>, which defaults to the cheapest tier and prints its own real cost on every run.</div>'+
    '</div>';
  }

  function renderStudio(){
    return '<div class="studio-cols">'+
      '<div class="studio-side"><div class="ws-label">Prompt library</div>'+
        '<div class="prompt-card is-active"><span class="prompt-status ready">Draft ready</span><p>Competitive analysis — top 5 EV two-wheeler brands in India</p></div>'+
        '<div class="prompt-card"><span class="prompt-status queued">Queued</span><p>Market entry — same-day delivery for a mid-size US grocery chain</p></div>'+
        '<div class="prompt-new">+ New prompt</div>'+
      '</div>'+
      '<div class="studio-main">'+
        '<div class="ws-label">Generated draft <span class="mono" style="text-transform:none; letter-spacing:0; color:var(--teal);">Draft tier · with web research</span></div>'+
        '<div style="font-weight:700; font-size:0.95rem; margin-bottom:2px;">India’s EV Two-Wheeler Race — Competitive Positioning, FY25</div>'+
        '<div style="font-size:0.76rem; color:var(--faint); margin-bottom:12px;">Draft, unpublished — not yet in the case library</div>'+
        '<div class="doc-card">'+
          '<p style="margin-bottom:10px;">India’s electric two-wheeler segment has grown from a negligible base to roughly a tenth of overall two-wheeler sales within a few years, accelerated by the FAME-II subsidy and a patchwork of state-level incentives that have since begun tapering.</p>'+
          '<p style="margin-bottom:10px;">Ola Electric entered as the volume leader, built on aggressive direct-to-consumer pricing and a large-scale factory in Tamil Nadu, but has faced sustained, widely reported service and after-sales quality complaints that appear to have slowed its growth relative to newer entrants — even as it became the first Indian EV two-wheeler maker to complete a public listing.</p>'+
          '<p style="margin-bottom:10px;">TVS Motor’s iQube and Bajaj Auto’s revived Chetak brand have both gained ground by leaning on dealer and service networks built over decades of petrol two-wheeler sales — an advantage pure-EV entrants do not have and cannot quickly replicate.</p>'+
          '<p style="margin-bottom:10px;">Ather Energy, backed in part by Hero MotoCorp as an investor, has taken a premium, software-forward position: a smaller unit-volume footprint than the leaders, built around its proprietary fast-charging network and a reputation for build quality among urban, tech-forward buyers.</p>'+
          '<p style="margin-bottom:10px;">Hero MotoCorp itself — India’s largest two-wheeler manufacturer overall by volume — entered later with its Vida sub-brand and has so far converted its dealer footprint into EV share more slowly than its overall scale would suggest.</p>'+
          '<p>Two structural factors cut across all five: financing penetration for two-wheeler EVs remains well below that for petrol two-wheelers, which several industry analysts cite as a continuing brake on demand despite a favorable total-cost-of-ownership case; and revised battery-safety certification requirements introduced after a string of 2022 fire incidents raised compliance costs across the segment.</p>'+
        '</div>'+
        '<div class="ws-label" style="margin-top:20px;">Faculty review</div>'+
        '<div class="annotation"><span class="annotation-tag">Flag</span><p>Confirm current market-share ordering against the latest SMEV/ICRA report before publishing — rankings shift quarter to quarter.</p></div>'+
        '<div class="annotation"><span class="annotation-tag">Edited</span><p>Softened “quality complaints” language to “widely reported” rather than presenting it as established fact.</p></div>'+
        '<div class="annotation"><span class="annotation-tag">Added</span><p>A sentence on FAME-III policy uncertainty for next academic year — the draft only covered FAME-II.</p></div>'+
        '<div class="approve-row">'+
          '<button class="btn" id="studio-approve-btn">Approve &amp; publish to case library</button>'+
          '<span id="studio-approve-status" class="mono" style="font-size:0.78rem; color:var(--faint);">Not yet published</span>'+
        '</div>'+
        '<p style="font-size:0.78rem; color:var(--faint); margin-top:14px; line-height:1.6;">Once approved, this draft is frozen, chunked, embedded, and added to the case library — from that point on it’s grounded exactly like every faculty-uploaded filing. Nothing a student sees is ever generated on the fly.</p>'+
      '</div>'+
    '</div>';
  }

  function wireStudio(){
    var btn = document.getElementById('studio-approve-btn');
    var status = document.getElementById('studio-approve-status');
    if (!btn) return;
    btn.addEventListener('click', function(){
      btn.textContent = 'Published to case library ✓';
      btn.classList.add('is-done');
      btn.disabled = true;
      status.textContent = 'Indexed · citable · case #6';
      status.style.color = 'var(--teal)';
    });
  }

  function animateStages(){
    var stages = document.querySelectorAll('#stage-row .stage');
    var i = 0;
    function step(){
      if (i > 0) stages[i-1].classList.remove('active');
      if (i > 0) stages[i-1].classList.add('done');
      if (i >= stages.length) return;
      stages[i].classList.add('active');
      i++;
      timers.push(setTimeout(step, reduceMotion ? 60 : 620));
    }
    step();
  }

  function animateMeters(){
    Array.prototype.forEach.call(document.querySelectorAll('.meter-fill'), function(el){
      var w = el.getAttribute('data-w');
      timers.push(setTimeout(function(){ el.style.width = w+'%'; }, 60));
    });
  }

  function startFeed(c){
    var el = document.getElementById('feed');
    if (!el) return;
    var lines = c.feed; var i = 0;
    function addOne(){
      var item = document.createElement('div');
      item.className = 'feed-item';
      item.innerHTML = '<span class="t mono">live</span>'+lines[i % lines.length];
      el.insertBefore(item, el.firstChild);
      while (el.children.length > 5){ el.removeChild(el.lastChild); }
      i++;
    }
    addOne();
    if (!reduceMotion){ timers.push(setInterval(addOne, 2400)); }
  }

  function render(){
    clearTimers();
    var c = caseById(state.caseId);
    updateActiveStates(c);
    var root = document.getElementById('view-root');
    if (state.role==='student'){
      root.innerHTML = renderStudent(c);
      playThread(c.studentThread, document.getElementById('student-thread'));
    } else if (state.role==='faculty'){
      root.innerHTML = renderFaculty(c);
      playThread(c.facultyThread, document.getElementById('faculty-thread'));
      animateMeters();
      startFeed(c);
    } else if (state.role==='pipeline'){
      root.innerHTML = renderPipeline(c);
      animateStages();
    } else if (state.role==='gateway'){
      root.innerHTML = renderGateway(c);
    } else {
      root.innerHTML = renderStudio();
      wireStudio();
    }
  }

  document.getElementById('replay-btn').addEventListener('click', render);
  renderRail();
  renderRoleTabs();
  render();
})();
</script>
</body>
</html>
